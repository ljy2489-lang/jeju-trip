<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF6EC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="제주여행">
  <meta name="description" content="2026.10.16~18 우리 가족 제주 2박 3일 인터랙티브 여행지도">
  <title>우리 가족 제주 여행지도</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="title-row">
      <div>
        <h1>우리 가족 제주 여행지도</h1>
        <div class="dates">10.16 금 – 10.18 일 · 성인 4 + 아기 2</div>
      </div>
      <div class="deco" aria-hidden="true"><img src="assets/jeju-family-hero.png" width="1536" height="1024" alt=""></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="일정 선택"></nav>
    <div class="tools">
      <button id="btn-flight" class="chip" type="button"></button>
      <button id="btn-course" class="chip" type="button"></button>
      <button id="btn-edit" class="chip" type="button"></button>
    </div>
  </header>
  <main>
    <div class="map-wrap">
      <div id="map" aria-label="제주 지도"></div>
      <div class="map-btns">
        <button id="btn-fit" class="round" type="button" aria-label="경로 전체 보기">⤢</button>
        <button id="btn-locate" class="round" type="button" aria-label="내 위치">◎</button>
      </div>
      <div class="legend" id="legend"></div>
    </div>
    <section id="sheet" class="sheet" aria-label="일정"><div class="grip"></div><div id="sheet-body"></div></section>
  </main>
  <div id="detail" class="detail" hidden></div>
  <dialog id="flight-dlg"></dialog>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="storage.js"></script>
  <script src="schedule.js"></script>
  <script src="data/places.js"></script>
  <script src="data/itinerary.js"></script>
  <script src="data/routes.js"></script>
  <script src="assets/stickers.js"></script>
  <script src="app.js"></script>
</body>
</html>
